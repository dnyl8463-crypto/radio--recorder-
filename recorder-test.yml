name: Radio Recorder Test

on:
  workflow_dispatch:

jobs:
  test-recording:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create recordings directory
        run: |
          mkdir -p recordings

      - name: Record Kol Chai for 5 minutes
        run: |
          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -y \
            -i "https://live.kcm.fm/live-new" \
            -t 300 \
            -vn \
            -c:a libmp3lame \
            -b:a 128k \
            recordings/kol_chai_test.mp3

      - name: Show recording
        run: |
          ls -lh recordings/
          ffprobe recordings/kol_chai_test.mp3
